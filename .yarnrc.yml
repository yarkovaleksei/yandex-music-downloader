# Политика Yarn 4 (ADR-008). Все пути состояния находятся внутри рабочей копии
# и игнорируются Git; yarn.lock и этот файл — отслеживаемые deliverables.
nodeLinker: node-modules
enableGlobalCache: false
enableMirror: false
enableTelemetry: false
cacheFolder: .yarn/cache
globalFolder: .cache/yarn/global
installStatePath: .yarn/install-state.gz

# Внутренние пакеты никогда не резолвятся через публичный registry (ADR-008).
npmScopes:
  music-downloader:
    npmRegistryServer: "https://registry.invalid/"

supportedArchitectures:
  os: [current, linux, darwin, win32]
  cpu: [current, x64, arm64]
  libc: [current, glibc, musl]
